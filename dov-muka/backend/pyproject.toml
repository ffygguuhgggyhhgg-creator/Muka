[tool.poetry]
name = "dov-muka-backend"
version = "0.1.0"
description = "Backend for TD Shikhabalova flour mill platform"
authors = ["TD Shikhabalova"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
sqlalchemy = "^2.0"
asyncpg = "^0.30"
alembic = "^1.14"
redis = "^5.2"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-multipart = "^0.0.18"
pydantic = "^2.10"
pydantic-settings = "^2.7"
email-validator = "^2.2"
httpx = "^0.28"
python-dotenv = "^1.1"
sentry-sdk = "^2.20"
celery = "^5.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
ruff = "^0.9"

[tool.poetry.scripts]
seed = "scripts.seed:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
